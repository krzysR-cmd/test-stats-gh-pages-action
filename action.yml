name: Test statistics for GitHub Pages
description: Collect supported test results, write a GitHub Actions summary, and maintain rolling statistics.
inputs:
  result-files:
    description: Newline-separated result file paths or glob patterns.
    required: true
  format:
    description: Result format (auto, junit, trx, nunit, xunit, or playwright-json).
    required: false
    default: auto
  site-directory:
    description: Existing site directory to update with the configured dashboard subdirectory.
    required: false
    default: site
  history-days:
    description: Rolling statistics window in days.
    required: false
    default: "30"
  stats-subdirectory:
    description: Relative directory within site-directory for runs.json and index.html.
    required: false
    default: reusable-stats
  report-name:
    description: Optional extra label appended to the repository name in the detailed dashboard title and used in the summary.
    required: false
    default: ""
  dashboard-url:
    description: Override the discovered GitHub Pages dashboard URL used in the GitHub Actions summary.
    required: false
    default: ""
  detailed-statistics:
    description: Generate the detailed rolling dashboard from supported test result files.
    required: false
    default: "true"
  playwright-results-directory:
    description: Directory containing Playwright-format JSON reports for the detailed dashboard.
    required: false
    default: downloaded-results
  shell-test-results:
    description: Optional JUnit, NUnit, xUnit, or VSTest XML result file path or glob pattern for the detailed dashboard.
    required: false
    default: ""
outputs:
  total:
    description: Number of tests across all input files.
    value: ${{ steps.stats.outputs.total }}
  passed:
    description: Number of passed tests, including retry successes identified by the result format.
    value: ${{ steps.stats.outputs.passed }}
  failed:
    description: Number of failed tests.
    value: ${{ steps.stats.outputs.failed }}
  skipped:
    description: Number of skipped tests.
    value: ${{ steps.stats.outputs.skipped }}
  stats-file:
    description: Path to the generated normalized run JSON.
    value: ${{ steps.stats.outputs.stats-file }}
runs:
  using: composite
  steps:
    - name: Generate test statistics
      id: stats
      shell: bash
      env:
        INPUT_RESULT_FILES: ${{ inputs.result-files }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SITE_DIRECTORY: ${{ inputs.site-directory }}
        INPUT_HISTORY_DAYS: ${{ inputs.history-days }}
        INPUT_STATS_SUBDIRECTORY: ${{ inputs.stats-subdirectory }}
        INPUT_REPORT_NAME: ${{ inputs.report-name }}
        INPUT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/src/main.py"
    - name: Generate detailed 30-day dashboard
      if: inputs.detailed-statistics == 'true'
      shell: bash
      env:
        RESULTS_DIR: ${{ inputs.playwright-results-directory }}
        SITE_DIR: ${{ inputs.site-directory }}
        STATS_SUBDIRECTORY: ${{ inputs.stats-subdirectory }}
        REPORT_NAME: ${{ inputs.report-name }}
        SHELL_TESTS_XML: ${{ inputs.shell-test-results }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/src/update-stats.sh"
