name: Test statistics for GitHub Pages
description: Normalize test result files, write a GitHub Actions summary, and update a rolling statistics site.
inputs:
  result-files:
    description: Newline-separated result file paths or glob patterns.
    required: true
  format:
    description: Result format (auto, junit, or playwright-json).
    required: false
    default: auto
  site-directory:
    description: Existing site directory to update, including stats/runs.json and stats/index.html.
    required: false
    default: site
  history-days:
    description: Rolling statistics window in days.
    required: false
    default: "30"
  stats-subdirectory:
    description: Relative directory within site-directory for runs.json and index.html.
    required: false
    default: reusable-stats
  report-name:
    description: Label used in the GitHub Actions summary.
    required: false
    default: Test results
  detailed-statistics:
    description: Generate the detailed Playwright and shell-test 30-day dashboard.
    required: false
    default: "true"
  playwright-results-directory:
    description: Directory containing Playwright JSON reports for the detailed dashboard.
    required: false
    default: downloaded-results
  shell-test-results:
    description: Optional JUnit XML file containing shell test results.
    required: false
    default: ""
outputs:
  total:
    description: Number of tests across all input files.
    value: ${{ steps.stats.outputs.total }}
  passed:
    description: Number of passed tests, including Playwright flaky passes.
    value: ${{ steps.stats.outputs.passed }}
  failed:
    description: Number of failed tests.
    value: ${{ steps.stats.outputs.failed }}
  skipped:
    description: Number of skipped tests.
    value: ${{ steps.stats.outputs.skipped }}
  stats-file:
    description: Path to the generated normalized run JSON.
    value: ${{ steps.stats.outputs.stats-file }}
runs:
  using: composite
  steps:
    - name: Generate test statistics
      id: stats
      shell: bash
      env:
        INPUT_RESULT_FILES: ${{ inputs.result-files }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SITE_DIRECTORY: ${{ inputs.site-directory }}
        INPUT_HISTORY_DAYS: ${{ inputs.history-days }}
        INPUT_STATS_SUBDIRECTORY: ${{ inputs.stats-subdirectory }}
        INPUT_REPORT_NAME: ${{ inputs.report-name }}
      run: python3 "${{ github.action_path }}/src/main.py"
    - name: Generate detailed 30-day dashboard
      if: inputs.detailed-statistics == 'true'
      shell: bash
      env:
        RESULTS_DIR: ${{ inputs.playwright-results-directory }}
        SITE_DIR: ${{ inputs.site-directory }}
        SHELL_TESTS_XML: ${{ inputs.shell-test-results }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/src/update-stats.sh"
